#!/usr/sbin/nft -f

# Router firewall — vuln-mgmt-lab
# Policy: default deny; Management is the only trusted segment;
# DMZ can initiate nothing.


flush ruleset

# ----------------- Interfaces -----------------
define WAN = ens33
define IF_INT = ens37
define IF_DMZ = ens38
define IF_MGMT = ens39

# ----------------- Networks and Hosts -----------------

define INTERNAL_NET = 10.10.10.0/24
define DMZ_NET = 10.10.20.0/24
define MGMT_NET = 10.10.30.0/24
define ADMIN_HOST = 192.168.1.1
define LOG_SERVER = 10.10.30.20

table inet filter {

	# Traffic addressed TO the router itself

	chain input {
		type filter hook input priority filter; policy drop;
		
		ct state established, related accept
		ct state invalid drop
		iif "lo" accept
		
		icmp {echo-request, destination-unreachable, time-exceeded} accept
		
		iifname $IF_MGMT ip saddr $MGMT_NET tcp dport 22 accept
        	iifname $WAN ip saddr $ADMIN_HOST tcp dport 22 accept
        	
        	counter log prefix "IN-DROP: " drop
	}
	
	# Traffic passing THROUGH the router between segments 
	
	chain forward {
		type filter hook forward priority filter; policy drop;
		
		ct state {established, related} accept
		ct state invalid drop
		
		# Management -> anywhere
		iifname $IF_MGMT ip saddr $MGMT_NET accept
		
		# Admin workstation -> Management only
		iifname $WAN oifname $IF_MGMT ip saddr $ADMIN_HOST accept
		
		# Internal -> log server, log shipping port only
        	#iifname $IF_INT oifname $IF_MGMT ip saddr $INTERNAL_NET ip daddr $LOG_SERVER tcp dport $LOG_PORT accept
		
		# Internal to DMZ, published web services only
		iifname $IF_INT oifname $IF_DMZ ip saddr $INTERNAL_NET ip daddr $DMZ_NET tcp dport {80,443,8080} accept
		
		# Internal -> internet (OS and app updates)
		iifname $IF_INT oifname $WAN ip saddr $INTERNAL_NET accept

		# DMZ: no rules on purpose — it may initiate nothing.
		
		counter log prefix "FWD-DROP: " drop
	}

	# Traffic FROM the router itself

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip nat{
	chain postrouting{
		type nat hook postrouting priority srcnat; policy accept;
		
		oifname $WAN ip saddr { $INTERNAL_NET , $MGMT_NET } masquerade
	}
}